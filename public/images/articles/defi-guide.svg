  <line x1="350" y1="145" x2="450" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <text x="400" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="46" fill="#a78bfa">DeFi去中心化金融</text>
  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="white">完全指南</text>
  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a0a0b0">从入门到精通</text>
  <rect x="300" y="370" width="200" height="3" rx="1.5" fill="#a78bfa"/>
