<svg width="960" height="560" viewBox="0 0 960 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">币安账户安全设置示意</title>
  <desc id="desc">展示手机绑定、Google 2FA、防钓鱼码和提现白名单四项安全设置</desc>
  <rect width="960" height="560" rx="28" fill="#111827"/>
  <rect x="56" y="54" width="852" height="452" rx="26" fill="#1F2937" stroke="#374151"/>
  <text x="96" y="120" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="30" font-weight="700">安全设置优先级</text>
  <text x="96" y="152" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16">注册完成后先做安全配置，再充值交易。</text>
  <g>
    <rect x="96" y="206" width="364" height="104" rx="20" fill="#FFFFFF"/>
    <circle cx="144" cy="258" r="24" fill="#D4A843"/>
    <path d="M134 258l8 8 18-22" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="182" y="250" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">Google 2FA</text>
    <text x="182" y="278" fill="#6B7280" font-family="Arial, sans-serif" font-size="15">备份密钥，离线保存</text>
  </g>
  <g>
    <rect x="500" y="206" width="364" height="104" rx="20" fill="#FFFFFF"/>
    <circle cx="548" cy="258" r="24" fill="#D4A843"/>
    <path d="M548 244v28M534 258h28" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <text x="586" y="250" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">手机绑定</text>
    <text x="586" y="278" fill="#6B7280" font-family="Arial, sans-serif" font-size="15">用于登录提醒和提现确认</text>
  </g>
  <g>
    <rect x="96" y="344" width="364" height="104" rx="20" fill="#FFFFFF"/>
    <circle cx="144" cy="396" r="24" fill="#D4A843"/>
    <path d="M130 399c8-22 36-22 44 0M137 388l7-12 7 12 7-12 7 12" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="182" y="388" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">防钓鱼码</text>
    <text x="182" y="416" fill="#6B7280" font-family="Arial, sans-serif" font-size="15">官方邮件必须带你的短语</text>
  </g>
  <g>
    <rect x="500" y="344" width="364" height="104" rx="20" fill="#FFFFFF"/>
    <circle cx="548" cy="396" r="24" fill="#D4A843"/>
    <path d="M536 398l9 9 22-27" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="586" y="388" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">提现白名单</text>
    <text x="586" y="416" fill="#6B7280" font-family="Arial, sans-serif" font-size="15">只允许提现到已审核地址</text>
  </g>
</svg>
