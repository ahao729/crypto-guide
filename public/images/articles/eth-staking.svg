<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="200" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="120" cy="380" r="180" fill="#8b5cf6" opacity="0.06"/>
  <!-- Ethereum diamond/hexagon visual -->
  <polygon points="400,80 440,110 440,150 400,180 360,150 360,110" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.3"/>
  <polygon points="400,100 425,120 425,145 400,165 375,145 375,120" fill="#8b5cf6" opacity="0.15"/>
  <!-- Staking growth arrows -->
  <path d="M300 190 L350 170" stroke="#10b981" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <path d="M450 170 L500 190" stroke="#10b981" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <!-- APR badge -->
  <rect x="340" y="200" width="120" height="30" rx="15" fill="#10b981" opacity="0.15"/>
  <text x="400" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#10b981">APR ~3-5%</text>
  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="#a78bfa">以太坊2.0质押</text>
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="42" fill="white">完全指南</text>
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a0a0b0">如何获得被动收益</text>
  <rect x="300" y="430" width="200" height="3" rx="1.5" fill="#a78bfa"/>
</svg>
