<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#2d1b3d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Decorative circles -->
  <circle cx="160" cy="80" r="200" fill="#7c3aed" opacity="0.08"/>
  <circle cx="680" cy="380" r="180" fill="#7c3aed" opacity="0.06"/>
  <!-- Call/Put visual -->
  <rect x="280" y="100" width="100" height="60" rx="8" fill="#10b981" opacity="0.15"/>
  <text x="330" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#10b981">看涨</text>
  <text x="330" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#10b981" dy="20">CALL</text>
  <rect x="420" y="100" width="100" height="60" rx="8" fill="#ef4444" opacity="0.15"/>
  <text x="470" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#ef4444">看跌</text>
  <text x="470" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ef4444" dy="20">PUT</text>
  <!-- Right arrow -->
  <path d="M395 130 L405 130" stroke="#a0a0b0" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="46" fill="#a78bfa">加密货币期权</text>
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="52" fill="white">入门指南</text>
  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a0a0b0">从零开始掌握期权交易核心概念</text>
  <rect x="300" y="370" width="200" height="3" rx="1.5" fill="#a78bfa"/>
