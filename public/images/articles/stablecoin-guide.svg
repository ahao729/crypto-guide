<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#1a2d3d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Decorative circles -->
  <circle cx="160" cy="100" r="220" fill="#3b82f6" opacity="0.08"/>
  <circle cx="680" cy="380" r="170" fill="#3b82f6" opacity="0.06"/>
  <!-- Stablecoin visual - three coins -->
  <circle cx="320" cy="140" r="35" fill="#3b82f6" opacity="0.15"/>
  <text x="320" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#3b82f6">USDT</text>
  <circle cx="400" cy="120" r="35" fill="#10b981" opacity="0.15"/>
  <text x="400" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#10b981">USDC</text>
  <circle cx="480" cy="140" r="35" fill="#a855f7" opacity="0.15"/>
  <text x="480" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#a855f7">DAI</text>
  <!-- Dollar sign -->
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#a0a0b0">$1.00</text>
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="46" fill="#60a5fa">稳定币完全指南</text>
  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a0a0b0">USDT、USDC与去中心化稳定币对比</text>
  <rect x="300" y="370" width="200" height="3" rx="1.5" fill="#60a5fa"/>
