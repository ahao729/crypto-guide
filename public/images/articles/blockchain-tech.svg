<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#1a2d3d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Decorative circles -->
  <circle cx="160" cy="80" r="220" fill="#3b82f6" opacity="0.08"/>
  <circle cx="680" cy="380" r="180" fill="#3b82f6" opacity="0.06"/>
  <!-- Blockchain chain link visual -->
  <rect x="260" y="100" width="40" height="40" rx="6" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="280" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#3b82f6" opacity="0.6">#1</text>
  <rect x="340" y="100" width="40" height="40" rx="6" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="360" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#3b82f6" opacity="0.6">#2</text>
  <rect x="420" y="100" width="40" height="40" rx="6" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="440" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#3b82f6" opacity="0.6">#3</text>
  <rect x="500" y="100" width="40" height="40" rx="6" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="520" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#3b82f6" opacity="0.6">#4</text>
  <!-- Chain links -->
  <line x1="300" y1="120" x2="340" y2="120" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  <line x1="380" y1="120" x2="420" y2="120" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  <line x1="460" y1="120" x2="500" y2="120" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  <!-- Data hash visual -->
  <text x="400" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6" opacity="0.4">0x4f8e...7a3b2</text>
  <text x="400" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="46" fill="#60a5fa">区块链技术</text>
  <text x="400" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="42" fill="white">入门指南</text>
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a0a0b0">从基础架构到共识机制</text>
  <rect x="300" y="400" width="200" height="3" rx="1.5" fill="#60a5fa"/>
</svg>
