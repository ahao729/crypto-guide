<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#1a2d3d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Decorative circles -->
  <circle cx="160" cy="80" r="200" fill="#06b6d4" opacity="0.08"/>
  <circle cx="680" cy="380" r="180" fill="#06b6d4" opacity="0.06"/>
  <!-- Two exchange boxes with arrow -->
  <rect x="220" y="110" width="130" height="80" rx="8" fill="#06b6d4" opacity="0.1" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>
  <text x="285" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#06b6d4">交易所 A</text>
  <text x="285" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#22d3ee" opacity="0.6">$50,000</text>
  <rect x="450" y="110" width="130" height="80" rx="8" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="515" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#f59e0b">交易所 B</text>
  <text x="515" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#fbbf24" opacity="0.6">$50,500</text>
  <!-- Arrow between -->
  <path d="M355 150 L440 150" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <polygon points="440,145 450,150 440,155" fill="#10b981" opacity="0.5"/>
  <!-- Profit tag -->
  <text x="400" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#10b981">+$500 套利空间</text>
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="46" fill="#22d3ee">加密货币套利</text>
  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="42" fill="white">交易策略</text>
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a0a0b0">现货与合约的价差博弈</text>
  <rect x="300" y="420" width="200" height="3" rx="1.5" fill="#22d3ee"/>
</svg>
