<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="100%" stop-color="#2d1b3d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="200" fill="#a855f7" opacity="0.08"/>
  <circle cx="120" cy="380" r="180" fill="#a855f7" opacity="0.06"/>
  <!-- DeFi interconnected circles visual -->
  <circle cx="310" cy="130" r="40" fill="#a855f7" opacity="0.12" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
  <text x="310" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#a855f7">借贷</text>
  <circle cx="400" cy="100" r="40" fill="#3b82f6" opacity="0.12" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
  <text x="400" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#3b82f6">DEX</text>
  <circle cx="490" cy="130" r="40" fill="#10b981" opacity="0.12" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
  <text x="490" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#10b981">质押</text>
  <!-- Connecting lines -->
  <line x1="350" y1="130" x2="360" y2="120" stroke="#a855f7" stroke-width="1" opacity="0.2"/>
