name: Production health

on:
  schedule:
    # GitHub Actions cron is UTC; every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe https://bqzn.top/api/health
        id: probe
        run: |
          for attempt in 1 2 3; do
            status=$(curl -sS --max-time 20 -o /tmp/health.json -w "%{http_code}" https://bqzn.top/api/health || true)
            echo "attempt=$attempt status=$status"
            cat /tmp/health.json 2>/dev/null || true
            echo
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Open or update incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create monitoring --repo "$REPO" --color B60205 --description "Production monitoring" --force >/dev/null 2>&1 || true
          BODY=$(printf 'Health check failed at %s\n\n```\n%s\n```\n' "$(date -u +%FT%TZ)" "$(cat /tmp/health.json 2>/dev/null || echo 'no response body')")
          ISSUE=$(gh issue list --repo "$REPO" --state open --label monitoring --search 'Production health check failing in:title' --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title 'Production health check failing' --body "$BODY" --label monitoring
          fi

      - name: Close incident after recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ISSUE=$(gh issue list --repo "$REPO" --state open --label monitoring --search 'Production health check failing in:title' --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --repo "$REPO" --comment "Recovered: /api/health returned 200 at $(date -u +%FT%TZ)."
          fi
