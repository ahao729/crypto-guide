<svg width="960" height="560" viewBox="0 0 960 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">C2C 购买 USDT 流程示意</title>
  <desc id="desc">展示选择 CNY 和 USDT、筛选商家、付款和到账的 C2C 入金流程</desc>
  <rect width="960" height="560" rx="28" fill="#F9FAFB"/>
  <rect x="68" y="70" width="824" height="420" rx="26" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="104" y="128" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="700">C2C 买 USDT 入金路径</text>
  <text x="104" y="160" fill="#6B7280" font-family="Arial, sans-serif" font-size="16">新手先小额测试，确认到账后再加大金额。</text>
  <g>
    <rect x="104" y="220" width="160" height="180" rx="20" fill="#FFF7E1" stroke="#D4A843"/>
    <text x="134" y="278" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">选择币种</text>
    <text x="134" y="312" fill="#6B7280" font-family="Arial, sans-serif" font-size="15">CNY → USDT</text>
    <text x="134" y="342" fill="#6B7280" font-family="Arial, sans-serif" font-size="15">固定购买金额</text>
  </g>
  <path d="M284 310h64" stroke="#D4A843" stroke-width="6" stroke-linecap="round"/>
  <path d="M340 294l20 16-20 16" stroke="#D4A843" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="380" y="220" width="180" height="180" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="414" y="278" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">筛选商家</text>
    <text x="414" y="312" fill="#6B7280" font-family="Arial, sans-serif" font-size="15">成交率 90%+</text>
    <text x="414" y="342" fill="#6B7280" font-family="Arial, sans-serif" font-size="15">订单多、评价好</text>
  </g>
  <path d="M582 310h64" stroke="#D4A843" stroke-width="6" stroke-linecap="round"/>
  <path d="M638 294l20 16-20 16" stroke="#D4A843" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="684" y="220" width="180" height="180" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="718" y="278" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">付款到账</text>
    <text x="718" y="312" fill="#6B7280" font-family="Arial, sans-serif" font-size="15">按订单付款</text>
    <text x="718" y="342" fill="#6B7280" font-family="Arial, sans-serif" font-size="15">确认释放 USDT</text>
  </g>
  <rect x="232" y="430" width="496" height="48" rx="14" fill="#FEF3C7"/>
  <text x="256" y="461" fill="#8A6A20" font-family="Arial, sans-serif" font-size="17" font-weight="700">不要线下私聊交易；一切沟通和付款凭证都保留在订单内。</text>
</svg>
